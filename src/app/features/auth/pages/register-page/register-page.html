<h1>Register</h1>

<form
  [formGroup]="form"
  (ngSubmit)="register()"
>

  <input
    type="text"
    placeholder="Name"
    formControlName="name"
  />

  <input
    type="email"
    placeholder="Email"
    formControlName="email"
  />

  <input
    type="password"
    placeholder="Password"
    formControlName="password"
  />

  <button type="submit">
    Register
  </button>

</form>
