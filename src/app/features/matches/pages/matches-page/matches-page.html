<h1 class="page-title">
  FIFA World Cup 2026
</h1>

<div class="matches-grid">

  @for (match of matches(); track match.id) {

    <div class="match-card">

      <div class="stage">
        {{ match.stage }}
      </div>

      <div class="teams">

        <div class="team">

          <img
            [src]="match.homeTeamCrest"
            [alt]="match.homeTeam"
          />

          <span>
            {{ match.homeTeam }}
          </span>

        </div>

        <div class="vs">
          VS
        </div>

        <div class="team">

          <img
            [src]="match.awayTeamCrest"
            [alt]="match.awayTeam"
          />

          <span>
            {{ match.awayTeam }}
          </span>

        </div>

      </div>

      <div class="match-info">

        <div>
          📅
          {{ match.date | date:'medium' }}
        </div>

        <div>
          {{ match.status }}
        </div>

      </div>

      <button
        class="predict-btn"
        [routerLink]="[
          '/predictions',
          match.id
        ]"
      >
        Predict Match
      </button>

    </div>

  }

</div>
