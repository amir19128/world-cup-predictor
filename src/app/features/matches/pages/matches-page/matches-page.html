@for (
  group of groupNames();
  track group
) {

  <section
    class="group-section"
  >

    <h2 class="group-title">
      {{ group }}
    </h2>

    @for (
      match of groupedMatches()[group];
      track match.id
    ) {

      <app-match-card
        [match]="match"
        [predictions]="predictions()"
      />

    }

  </section>

}
